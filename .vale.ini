# The settings of Vale that the dotfiles lay over the defaults of
# lovaizu/checks.

# Vale reads a file of an extension that it doesn't know as plain text, so
# it checks the code of these files as prose. Their prose is in comments
# that start with #, as in Python, so Vale reads them as Python, which
# checks only the comments. The tmpl files here are shell scripts, and the
# toml and ini files are settings of tools.
[formats]
sh = py
jq = py
tmpl = py
toml = py
ini = py

# Vale can't read only the prose of these files: the modify templates of
# chezmoi have no extension, and the prose of the marketplace is in JSON
# values. The rule Quotes of the Google style finds a quote next to a comma
# or a period, which each line of their code has, and their prose has no
# quotes. A section of Vale matches the full path of a file, so each
# pattern starts with **.
[**/home/modify_dot_*]
Google.Quotes = NO

[**/.claude-plugin/marketplace.json]
Google.Quotes = NO
