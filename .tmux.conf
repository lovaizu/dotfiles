# Emacs keybindings
set -g mode-keys emacs
set -g status-keys emacs

# Change prefix to C-x
unbind C-b
set -g prefix C-x
bind C-x send-prefix

# Split panes with C-x 2 / C-x 3 (Emacs style)
bind 2 split-window -v -c "#{pane_current_path}"
bind 3 split-window -h -c "#{pane_current_path}"

# Navigate panes with Alt+Arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Cycle through panes with C-o
bind -n C-o select-pane -t :.+

# Resize panes with prefix + Arrow (repeatable)
bind -r Up resize-pane -U 2
bind -r Down resize-pane -D 2
bind -r Left resize-pane -L 2
bind -r Right resize-pane -R 2

# Equalize pane sizes
bind = select-layout even-horizontal
bind + select-layout even-vertical

# Auto-equalize on split/close
set-hook -g after-split-window "select-layout -E"
set-hook -g pane-exited "select-layout -E"

# New window keeps current directory
bind c new-window -c "#{pane_current_path}"

# Enable mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 50000

# Reduce escape key delay
set -sg escape-time 10

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Enable 256 colors
set -g default-terminal "tmux-256color"

# Set window title
set -g set-titles on
set -g set-titles-string "#S: #W"

# Status bar
set -g status-style bg=colour234,fg=colour141
set -g status-left "[#S] "
set -g status-right "%Y-%m-%d %H:%M"

# Active Pane Identification
set -g pane-border-indicators both
set -g pane-border-status top
set-hook -g window-layout-changed 'set-window -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set -g pane-active-border-style 'fg=#bd93f9'
set -g pane-border-style 'fg=#555555'
set -g pane-border-format "#{?pane_active, < #P: #{b:pane_current_path} > , #P: #{b:pane_current_path} }"