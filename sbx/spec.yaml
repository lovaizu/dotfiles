# syntax=docker/sandbox-kit:3
# A mixin, as sbx v0.51.0 and later combine no v1 or v2 kit with the v3 kits
# that it publishes. A mixin can't set the command that the sandbox starts,
# so sb starts herdr.
schemaVersion: "3"
kind: mixin
displayName: lovaizu/dotfiles
description: Applies lovaizu/dotfiles at the creation of the sandbox, and again at each start.
# sbx runs the install commands of the kits in the order of what they
# require, never in the order of the --kit flags. The dotfiles write into
# ~/.claude, which belongs to root until the mixin of Claude Code gives it
# to the agent.
requires: ["claude"]

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # The Node.js builds that mise downloads load libatomic.so.1, which
        # the image of the sandbox doesn't hold, as lovaizu/dotfiles#96
        # measured. The script of setup.sh that installs it runs on WSL
        # alone, so the sandbox installs it here, before setup.sh runs mise.
        - description: Install libatomic1 for Node.js of mise
          user: "0"
          command: apt-get update && apt-get install -y libatomic1
        - description: Apply lovaizu/dotfiles
          user: "1000"
          command: >-
            export HOME=/home/agent PATH="/home/agent/.local/bin:$PATH" SHELL=/bin/bash &&
            git clone https://github.com/lovaizu/dotfiles.git "$HOME/.local/share/dotfiles" &&
            "$HOME/.local/share/dotfiles/setup.sh"
      startup:
        # A failed update must not stop the sandbox from starting. sbx v0.51.0
        # and later only warn when a startup command fails, but herdr covers
        # the warning at once. The output of this command goes only to
        # /var/log/sbx-kit-startup.log, so it writes a notice to a file, and
        # update-notice.sh prints that file in each new shell.
        - description: Pull main of lovaizu/dotfiles and apply it again
          user: "1000"
          command:
            - sh
            - -c
            - |-
              export PATH="$HOME/.local/bin:$PATH" SHELL=/bin/bash
              dotfiles="$HOME/.local/share/dotfiles"
              failed=
              git -C "$dotfiles" pull --ff-only || failed="git pull --ff-only exited with code $?"
              if [ -z "$failed" ]; then
                "$dotfiles/setup.sh" || failed="./setup.sh exited with code $?"
              fi
              notice_sh="$HOME/.config/shell/update-notice.sh"
              if [ ! -f "$notice_sh" ]; then
                echo "$notice_sh is missing, so no shell reports the result of this update." >&2
                exit 0
              fi
              . "$notice_sh"
              if [ -z "$failed" ]; then
                rm -f "$dotfiles_update_notice"
                exit 0
              fi
              mkdir -p "$(dirname "$dotfiles_update_notice")"
              cat >"$dotfiles_update_notice" <<EOF

              WARNING: The dotfiles weren't updated at the start of the sandbox on $(date).
                $failed, so the sandbox runs with the settings of the last update that succeeded.
                /var/log/sbx-kit-startup.log has the output that says why.
                Fix: remove the cause in $dotfiles, then restart the sandbox.
                The next update that succeeds removes this notice.

              EOF
              exit 0
