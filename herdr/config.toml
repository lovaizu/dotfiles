onboarding = false
[ui.toast]
delivery = "terminal"

[ui]
# The focused pane's shell sets "<host>: <dir>"; herdr's default title
# would name the PC instead of the WSL distro, and no directory.
window_title = "{terminal_title}"
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[theme]
name = "gruvbox"
auto_switch = true
dark_name = "gruvbox"
light_name = "gruvbox-light"

[theme.custom.dark]
active_row_bg = "#504945"

[theme.custom.light]
active_row_bg = "#d5c4a1"

[keys]
prefix = "ctrl+t"
previous_workspace = "prefix+["
next_workspace     = "prefix+]"
next_agent = "prefix+u"
copy_mode = "prefix+y"
