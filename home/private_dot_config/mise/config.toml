# The tools that mise installs on every machine. mise installs each one only
# at the version and with the sha256 that mise.lock beside this file keeps,
# so a download that isn't pinned there, or that has changed, fails.
# run_onchange_before_install-mise-tools.sh.tmpl installs them. After you
# change a version, set MISE_GLOBAL_CONFIG_FILE to the full path of this
# file, and run:
# mise lock -g --platform linux-x64,linux-arm64,macos-arm64,macos-x64
[tools]
chezmoi = "2.73.2"
lefthook = "2.2.2"
herdr = "0.9.5"
jq = "1.8.2"
shfmt = "3.14.1"
starship = "1.27.0"
uv = "0.13.7"
